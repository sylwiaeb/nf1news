<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  {% capture desc %}{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}{% endcapture %}
  <meta name="description" content="{{ desc | strip | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ desc | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NF1 News – niezależny serwis informacyjny o NF1 w Polsce">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.image | default: '/assets/og-image.png' | absolute_url }}">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ desc | strip | escape }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <style>
    /* Paleta wykresów: kolory c1–c8 używaj po kolei (c1, c2, c3…), nie losowo. */
    :root { --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; }
    @media (prefers-color-scheme: dark) { :root { --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; } }
    body { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem; font: 18px/1.6 Georgia, serif; color: #222; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #ddd; background: #161616; } a { color: #8ab4f8; } }
    header, footer { font-family: system-ui, sans-serif; font-size: 0.9rem; }
    header { margin-bottom: 2rem; }
    header a.title { display: inline-flex; align-items: flex-end; gap: 0.45rem; font-weight: 700; font-size: 1.25rem; line-height: 1; text-decoration: none; color: inherit; vertical-align: -0.15rem; }
    header a.title svg { display: block; }
    nav a { margin-left: 1rem; }
    .date { color: #777; font-family: system-ui, sans-serif; font-size: 0.85rem; }
    article { margin-bottom: 2.5rem; }
    h1, h2 { line-height: 1.25; }
    ul.list { list-style: none; padding: 0; }
    ul.list li { margin-bottom: 0.5rem; }
    footer { margin-top: 3rem; color: #777; }
    table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1rem 0; font-family: system-ui, sans-serif; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { border-bottom-width: 2px; }
    .chart { margin: 1rem 0 1.5rem; font-family: system-ui, sans-serif; font-size: 0.8rem; }
    .chart .legend { margin: 0 0 0.5rem; color: #777; }
    .chart .row { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.5rem; align-items: center; margin: 2px 0; }
    .chart .track { display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .bar { display: inline-block; height: 0.9rem; min-width: 2px; background: var(--c1); border-radius: 0 4px 4px 0; }
    .legend .bar { width: 0.8rem; height: 0.8rem; vertical-align: -0.1rem; margin-right: 0.2rem; }
    .legend .item { white-space: nowrap; margin-right: 0.8rem; }
    .legend .bar { border-radius: 2px; }
    .bar.c1 { background: var(--c1); }
    .bar.c2 { background: var(--c2); }
    .bar.c3 { background: var(--c3); }
    .bar.c4 { background: var(--c4); }
    .bar.c5 { background: var(--c5); }
    .bar.c6 { background: var(--c6); }
    .bar.c7 { background: var(--c7); }
    .bar.c8 { background: var(--c8); }
    .share { font-family: system-ui, sans-serif; font-size: 0.85rem; color: #777; margin-top: -0.5rem; }
    .source { color: #777; font-family: system-ui, sans-serif; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <a class="title" href="{{ '/' | relative_url }}"><svg width="20" height="21" viewBox="0 0 35 37" aria-hidden="true"><rect x="0" y="16" width="9" height="21" rx="2" fill="var(--c2)"/><rect x="13" y="8" width="9" height="29" rx="2" fill="var(--c1)"/><rect x="26" y="0" width="9" height="37" rx="2" fill="currentColor"/></svg>{{ site.title }}</a>
    <nav style="display:inline"><a href="{{ '/wpisy/' | relative_url }}">Wszystkie wpisy</a><a href="{{ '/o-serwisie/' | relative_url }}">O serwisie</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>{{ site.description }} · <a href="{{ '/prywatnosc/' | relative_url }}">Prywatność</a></footer>
</body>
</html>
