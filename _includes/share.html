{% assign share_url = include.post.url | absolute_url | url_encode %}
{% assign share_text = include.post.title | url_encode %}
<p class="share">Udostępnij: <a href="https://twitter.com/intent/tweet?url={{ share_url }}&amp;text={{ share_text }}" target="_blank" rel="noopener">na X</a> · <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener">na Facebooku</a></p>
