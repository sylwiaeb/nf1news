{% capture body %}{% include {{ include.body }} %}{% endcapture %}
<div class="mail-box">
<p class="mail">
<button type="button" class="btn copy" data-target="{{ include.id }}">{{ include.button | default: "Skopiuj treść" }}</button>
{% if include.to %}<a class="btn mailto" href="mailto:{{ include.to }}" data-target="{{ include.id }}" data-to="{{ include.to }}" data-bcc="{{ include.bcc }}" data-subject="{{ include.subject }}">Otwórz w programie pocztowym</a>{% endif %}
</p>
<p class="copy-msg" role="status" aria-live="polite"></p>
{% if include.note %}<p class="mail-note"><strong>{{ include.note }}</strong></p>{% endif %}
<label for="{{ include.id }}">{% if include.label %}{{ include.label }}{% else %}Treść{% if include.to and include.subject == nil %} (pierwsza linia to temat maila){% endif %}{% endif %}. Jeśli przyciski nie działają, przytrzymaj palec w polu, wybierz „Zaznacz wszystko”, a potem „Kopiuj”.</label>
<textarea id="{{ include.id }}" readonly rows="{{ include.rows | default: 10 }}">{{ body | strip | escape }}</textarea>
</div>
