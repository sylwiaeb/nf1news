name: Codzienny licznik na X

# Licznik dni (bez opieki medycznej i od decyzji MZ o zakończeniu prac):
# obrazek nf1news.pl/assets/licznik.png i post na X z grafiką, link do
# czekamy.nf1news.pl w pierwszym komentarzu.
# Uruchamia go zaplanowane zadanie Claude: o 2:17 tryb=obrazek, ok. 8:30 tryb=x.
# Cron GitHuba niżej to tylko zapas (zwykle spóźnia się o wiele godzin).
# Ręcznie: Actions → „Codzienny licznik na X” → Run workflow
# (proba = tak tylko robi grafikę i pokazuje tekst, nic nie wysyła).

on:
  # Zapas: jeśli zaplanowane zadanie nie ruszy. Post idzie raz dziennie, kolejne przebiegi go pomijają.
  schedule:
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
    - cron: "7 7 * * *"
    - cron: "41 7 * * *"
    - cron: "13 8 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      proba:
        description: "tak = tylko podgląd (bez wysyłania na X)"
        required: false
        default: "tak"
      tryb:
        description: "oba, obrazek (tylko obrazek na stronę) albo x (tylko post na X)"
        required: false
        default: "oba"

permissions:
  contents: write

concurrency:
  group: x-licznik
  cancel-in-progress: false

jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests-oauthlib pyyaml
      - name: Playwright do grafiki
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Licznik (grafika, post na X, obrazek na stronę)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PROBA: ${{ github.event.inputs.proba }}
          TRYB: ${{ github.event.inputs.tryb || 'oba' }}
        run: |
          dzis=$(TZ=Europe/Warsaw date +%F)
          git config user.name "NF1 News"
          git config user.email "nf1news@users.noreply.github.com"
          if [ "$PROBA" = "tak" ]; then
            python .github/scripts/x_licznik.py --proba
            exit 0
          fi
          # Post na X: tylko raz dziennie (znacznik: pusty commit „Licznik: X na DATA”).
          wyslij=nie
          if [ "$TRYB" != "obrazek" ]; then
            if git log --oneline --grep "Licznik: X na $dzis" | grep -q .; then
              echo "Dzisiejszy post na X już poszedł, pomijam."
            else
              wyslij=tak
            fi
          fi
          if [ "$wyslij" = "tak" ]; then
            if python .github/scripts/x_licznik.py; then
              git commit --allow-empty -q -m "Licznik: X na $dzis"
            else
              blad=1
            fi
          else
            python .github/scripts/x_licznik.py --proba
          fi
          # Obrazek na stronę (nf1news.pl/assets/licznik.png, np. do bloga stowarzyszenia).
          if [ "$TRYB" != "x" ]; then
            plik=$(ls licznik-grafiki/*-kwadrat.png | head -1)
            cp "$plik" assets/licznik.png
            git add assets/licznik.png
            git diff --cached --quiet || git commit -q -m "Licznik: obrazek na $dzis"
          fi
          git push
          exit ${blad:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafika-licznika
          path: licznik-grafiki/
