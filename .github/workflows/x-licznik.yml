name: Codzienny licznik na X

# Codziennie rano post na X z licznikiem dni (bez skoordynowanej opieki
# i od pisma Ministerstwa Zdrowia), grafika z licznikiem, link do
# czekamy.nf1news.pl w pierwszym komentarzu. 7:07 UTC = 8:07 zimą, 9:07 latem.
# Ręcznie: Actions → „Codzienny licznik na X” → Run workflow
# (proba = tak tylko robi grafikę i pokazuje tekst, nic nie wysyła).

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      proba:
        description: "tak = tylko podgląd (bez wysyłania na X)"
        required: false
        default: "tak"

permissions:
  contents: write

concurrency:
  group: x-licznik
  cancel-in-progress: false

jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests-oauthlib pyyaml
      - name: Playwright do grafiki
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Licznik na X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          # Jeśli dziś licznik już poszedł (np. ręcznie, a cron się spóźnił), nie wysyła drugi raz.
          if [ "${{ github.event.inputs.proba }}" != "tak" ] && git log --oneline --grep "Licznik: obrazek na $(TZ=Europe/Warsaw date +%F)" | grep -q .; then
            echo "Dzisiejszy licznik już wysłany, pomijam."
            exit 0
          fi
          if [ "${{ github.event.inputs.proba }}" = "tak" ]; then
            python .github/scripts/x_licznik.py --proba
          else
            python .github/scripts/x_licznik.py
          fi
      - name: Obrazek licznika na stronę (nf1news.pl/assets/licznik.png, np. do bloga stowarzyszenia)
        if: always() && github.event.inputs.proba != 'tak'
        run: |
          plik=$(ls licznik-grafiki/*-kwadrat.png 2>/dev/null | head -1)
          [ -n "$plik" ] || { echo "Brak grafiki."; exit 0; }
          cp "$plik" assets/licznik.png
          git config user.name "NF1 News"
          git config user.email "nf1news@users.noreply.github.com"
          git add assets/licznik.png
          git diff --cached --quiet && exit 0
          git commit -m "Licznik: obrazek na $(TZ=Europe/Warsaw date +%F)"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafika-licznika
          path: licznik-grafiki/
